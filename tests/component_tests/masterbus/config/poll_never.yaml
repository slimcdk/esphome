# A poller that never runs leaves the device to other nodes, and is no reason to warn.
packages:
  base: !include _base.yaml

masterbus:
  - id: mb
    canbus_id: mb_can
    devices:
      - id: mb_battery
        device: 0x6C1001
        timeout: 60s

sensor:
  - platform: masterbus
    masterbus_device_id: mb_battery
    param: 0x0001
    name: Battery voltage
    update_interval: never
