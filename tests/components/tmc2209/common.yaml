stepper:
  - platform: tmc2209
    id: tmc2209_stepper_1
    max_speed: 250 steps/s
    acceleration: 100 steps/s^2
    deceleration: 200 steps/s^2
    step_pin: ${step_pin}
    dir_pin: ${dir_pin}
    enn_pin: ${enn_pin}
    diag_pin: ${diag_pin}
    index_pin: ${index_pin}
    config_dump_include_registers: true
    on_status:
      - logger.log:
          format: "Driver is reporting an update! (code %d)"
          args: ["code"]
    on_stall:
      - logger.log: "Motor stalled!"
      - stepper.stop: tmc2209_stepper_1

