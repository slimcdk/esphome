sensor:
  - platform: template
    id: pack_voltage
  - platform: template
    id: pack_current
  - platform: template
    id: pack_soc
  - platform: template
    id: pack_temperature

bms_emulator:
  - id: bms
    type: growatt_pylontech
    canbus_id: canbus_bus
    voltage_id: pack_voltage
    current_id: pack_current
    state_of_charge_id: pack_soc
    temperature_id: pack_temperature
    charge_voltage: 55.0
    discharge_voltage: 48.0
    charge_current_limit: !lambda "return id(pack_soc).state >= 98 ? 20.0f : 100.0f;"
    discharge_current_limit: 100
    charge_enabled: !lambda "return id(pack_soc).state < 100;"

binary_sensor:
  - platform: bms_emulator
    bms_emulator_id: bms
    inverter_online:
      name: Inverter online
