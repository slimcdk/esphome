# One microcontroller bridging two buses. The ESP32 has a single CAN controller, so the second bus
# comes from the shared secondary package, which puts an MCP2515 on SPI.

packages:
  canbus_secondary: !include ../../test_build_components/common/canbus_secondary/esp32-idf.yaml

masterbus:
  - id: mb_port
    canbus_id: canbus_bus
    devices:
      - id: mb_port_battery
        device: 0x6D56EA
  - id: mb_starboard
    canbus_id: canbus_bus_2
    devices:
      - id: mb_starboard_battery
        device: 0x6D56EA

sensor:
  - platform: masterbus
    masterbus_device_id: mb_port_battery
    param: 0x0001
    name: Port battery voltage
  - platform: masterbus
    masterbus_device_id: mb_starboard_battery
    param: 0x0001
    name: Starboard battery voltage
