masterbus:
  - id: mb
    canbus_id: canbus_bus
    log_all_frames: true
    on_unknown_frame:
      - logger.log:
          format: "undecoded message 0x%02X from 0x%06X, %u bytes"
          args: ["type", "device", "x.size()"]
    devices:
      - id: mb_battery
        device: 0x6D56EA
        on_online:
          - logger.log: "Battery bank answered"
        on_offline:
          - logger.log: "Battery bank stopped answering"
      - id: mb_charger
        device: 0x535E30
        timeout: 5min

sensor:
  - platform: masterbus
    masterbus_device_id: mb_battery
    param: 0x0000
    name: State of charge
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 1
    filters:
      - throttle: 10s
  - platform: masterbus
    masterbus_device_id: mb_battery
    param: 0x0001
    name: Battery voltage
    update_interval: 5s
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
  - platform: masterbus
    masterbus_device_id: mb_charger
    param: 0x0012
    name: Charger state index
    value_type: list_option
    icon: mdi:battery-charging

binary_sensor:
  - platform: masterbus
    masterbus_device_id: mb_charger
    param: 0x0015
    name: Charger state
    update_interval: 1min

text_sensor:
  - platform: masterbus
    masterbus_device_id: mb_battery
    param: 0x005E
    name: Battery clock
    value_type: time
  - platform: masterbus
    masterbus_device_id: mb_charger
    param: 0x0018
    name: Charger battery name
    timeout: 30min

switch:
  # The same field as the binary sensor above, from the writing side. A real configuration picks
  # one of the two; both are here to compile both.
  - platform: masterbus
    masterbus_device_id: mb_charger
    param: 0x0015
    name: Charger state control

button:
  # Field 117 is an event: writing it closes the relay, and reading it always answers false. The
  # block's own current is the only evidence the command took effect.
  - platform: masterbus
    masterbus_device_id: mb_battery
    param: 0x0075
    name: Close battery relay

number:
  - platform: masterbus
    masterbus_device_id: mb_charger
    param: 0x0014
    name: Maximum charge current
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1

select:
  - platform: masterbus
    masterbus_device_id: mb_charger
    param: 0x0012
    name: Charger phase
    tab: configuration
    options:
      - Bulk
      - Absorption
      - Float
